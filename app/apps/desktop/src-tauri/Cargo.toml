[package]
name = "mistake-agent-desktop"
version = "0.1.0"
description = "Local teacher practice agent — Zhixue login validation"
edition = "2021"
rust-version = "1.88"

[lib]
name = "mistake_agent_desktop_lib"
# Windows/Mac desktop binary links this Rust library directly. Mobile packaging
# will add its staticlib/cdylib targets when the mobile shell is implemented.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
rusqlite = { version = "0.41", features = ["bundled"] }
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
