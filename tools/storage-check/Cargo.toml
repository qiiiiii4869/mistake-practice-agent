[package]
name = "mistake-agent-storage-check"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
